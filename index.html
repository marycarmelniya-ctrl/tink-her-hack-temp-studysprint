<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudySprint - Smart Study Session Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📚 StudySprint</h1>
    <p>Smart Study Session Planner</p>

    <!-- TASK SECTION -->
    <section>
    <h2>Your Tasks</h2>

    <ul id="taskList"></ul>

    <h3>✅ Completed</h3>
    <ul id="completedList"></ul>
</section>


    <!-- TASK LIST -->
    <section>
        <h2>Your Tasks</h2>
        <ul id="taskList"></ul>
    </section>

    <!-- TIMER SECTION -->
    <section>
        <h2>⏳ Study Timer</h2>

        <h3>📚 Focus Mode</h3>
        <div class="time-options">
            <button class="time-btn" data-time="25">25 min</button>
            <button class="time-btn" data-time="30">30 min</button>
            <button class="time-btn" data-time="60">1 Hour</button>
        </div>

        <!-- Custom Time -->
        <div class="custom-time">
            <input type="number" id="customMinutes" placeholder="Enter minutes" min="1">
            <button id="setCustomTime">Set</button>
        </div>

        <h1 id="timerDisplay">25:00</h1>

        <!-- Motivation Text -->
        <p id="motivationText"></p>

        <div class="timer-controls">
            <button id="startBtn">▶ Start</button>
            <button id="pauseBtn">⏸ Pause</button>
            <button id="resetBtn">⟳ Reset</button>
            <button id="add5">+5 min</button>
            <button id="add10">+10 min</button>
        </div>
    </section>

    <!-- PROGRESS SECTION -->
    <section>
        <h2>Progress</h2>
        <h3 id="progressText">0 / 0 Tasks Completed</h3>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

        <h4 id="sessionCount">Focus Sessions Completed: 0</h4>
    </section>

    <script src="script.js"></script>

</body>
</html>
