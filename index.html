<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudySprint - Smart Study Session Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>📚 StudySprint</h1>
    <p>Smart Study Session Planner</p>

    <!-- TASK SECTION -->
    <section>
        <h2>Add Study Task</h2>
        <input type="text" id="taskInput" placeholder="Enter study task">
        <button id="addTaskBtn">Add Task</button>
    </section>

    <!-- TASK LIST -->
    <section>
        <h2>Your Tasks</h2>
        <ul id="taskList"></ul>
    </section>
    <section>
    <h2>⏳ Study Timer</h2>

    <h3>📚 Focus Mode</h3>
<div class="time-options">
    <button class="time-btn" data-time="25">25 min</button>
    <button class="time-btn" data-time="30">30 min</button>
    <button class="time-btn" data-time="60">1 Hour</button>
</div>

<!-- ⭐ Custom Time -->
<div class="custom-time">
    <input type="number" id="customMinutes" placeholder="Enter minutes" min="1">
    <button id="setCustomTime">Set</button>
</div>

    <h1 id="timerDisplay">25:00</h1>

    <div class="timer-controls">
    <button id="startBtn">▶ Start</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="resetBtn">⟳ Reset</button>

    <!-- ADD THESE BELOW RESET -->
    <button id="add5">+5 min</button>
    <button id="add10">+10 min</button>
</div>


   
    <!-- PROGRESS SECTION -->
    <section>
        <h2>Progress</h2>
        <h3 id="progressText">0 / 0 Tasks Completed</h3>
        <div class="progress-bar">
    <div id="progressFill"></div>
</div>
    </section>

    <script src="script.js"></script>
</body>
</html>
